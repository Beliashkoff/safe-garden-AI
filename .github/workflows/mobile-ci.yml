name: mobile-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: mobile

env:
  FLUTTER_VERSION: '3.41.9'
  JAVA_VERSION: '17'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: dart format check
        run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze --fatal-infos

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test --coverage --reporter=expanded

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          retention-days: 7

  build-apk-debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-apk-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Decode the upload keystore + write key.properties from secrets so the
      # release APK is signed with a STABLE key (Google Sign-In needs a fixed
      # SHA-1; Play needs a real key). If the keystore secret is absent the build
      # falls back to debug signing (build.gradle.kts) — sideload only.
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — release APK will be debug-signed (sideload only, no Google Sign-In)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured (upload keystore)."

      # Inject prod build-time config (app_config.dart reads these via
      # String.fromEnvironment). Without --dart-define the APK keeps dev
      # defaults (API_BASE_URL=http://10.0.2.2:8080 — emulator loopback) and is
      # useless on a real tester device. Values come from repo vars/secrets;
      # API_BASE_URL falls back to prod so the APK is always usable.
      # Passed via env (not inline ${{ }}) to avoid shell injection.
      - name: Build release APK (prod config)
        env:
          API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://api.agronomai.site/v1' }}
          SENTRY_DSN: ${{ secrets.MOBILE_SENTRY_DSN }}
          # VK ID app credentials reach gradle as project properties
          # (android/app/build.gradle.kts manifest placeholders).
          ORG_GRADLE_PROJECT_vkidClientId: ${{ vars.VKID_CLIENT_ID }}
          ORG_GRADLE_PROJECT_vkidClientSecret: ${{ secrets.VKID_CLIENT_SECRET }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_ENV=prod

      # Debug-signed (build.gradle.kts release uses the debug keystore): installs
      # via sideload, NOT uploadable to Play. Stable signing is Part 2.
      - uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
