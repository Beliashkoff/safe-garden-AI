name: build-images

# Builds + pushes the api/llmworker/cleanup images to GHCR, then deploys them to
# the two prod VMs over SSH. CI (backend-ci.yml) only lints/tests; this is the
# deploy artifact + CD. Runs on main and version tags. Deploy pins the exact
# sha-<short> tag (not the floating :latest) so prod runs exactly what was built;
# rollback is just re-pinning a previous sha (see infra/docker/compose/README.md).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'backend/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: backend/Dockerfile
          - image: llmworker
            file: backend/Dockerfile.llmworker
          - image: cleanup
            file: backend/Dockerfile.cleanup
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # github.repository = Beliashkoff/safe-garden-AI; metadata-action
          # lowercases it -> ghcr.io/beliashkoff/safe-garden-ai/<image>.
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # CD: SSH into each prod VM and roll it to the exact image just built. Runs only
  # after all three images pushed. The VMs already have a `safegarden` user in the
  # docker group with a ghcr login (~/.docker/config.json) — see the cleanup
  # systemd unit; the deploy key authorizes that same user. No inbound besides SSH.
  # Required config (Settings -> Secrets and variables -> Actions), per VM:
  #   secrets: API_VM_HOST, API_VM_SSH_KEY, API_VM_FINGERPRINT
  #            WORKER_VM_HOST, WORKER_VM_SSH_KEY, WORKER_VM_FINGERPRINT
  #   vars:    API_VM_DOMAIN, WORKER_VM_DOMAIN
  #            (optional) API_VM_SSH_USER/PORT, WORKER_VM_SSH_USER/PORT
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Surfaces deployments in the GitHub UI; add required reviewers here later to
    # gate prod behind manual approval without touching this file.
    environment: production
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Compute image tag
        # Must match docker/metadata-action type=sha (sha- prefix, 7-char short).
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Deploy api VM (Yandex)
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DOMAIN: ${{ vars.API_VM_DOMAIN }}
        with:
          host: ${{ secrets.API_VM_HOST }}
          username: ${{ vars.API_VM_SSH_USER || 'safegarden' }}
          port: ${{ vars.API_VM_SSH_PORT || '22' }}
          key: ${{ secrets.API_VM_SSH_KEY }}
          fingerprint: ${{ secrets.API_VM_FINGERPRINT }}
          envs: IMAGE_TAG,DOMAIN
          script: |
            set -eu
            cd /etc/safegarden/compose
            # Pin tag + domain durably: compose reads ./.env for ${IMAGE_TAG} and
            # ${DOMAIN} interpolation, so manual `up -d` and reboots reuse them.
            # These are the only two interpolation vars the compose files use.
            umask 077
            printf 'DOMAIN=%s\nIMAGE_TAG=%s\n' "$DOMAIN" "$IMAGE_TAG" > .env
            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Deploy worker VM (Frankfurt)
        # Skip until the worker VM is configured (WORKER_VM_DOMAIN set); then it
        # activates automatically. Still attempts even if the api deploy failed.
        if: ${{ !cancelled() && vars.WORKER_VM_DOMAIN != '' }}
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DOMAIN: ${{ vars.WORKER_VM_DOMAIN }}
        with:
          host: ${{ secrets.WORKER_VM_HOST }}
          username: ${{ vars.WORKER_VM_SSH_USER || 'safegarden' }}
          port: ${{ vars.WORKER_VM_SSH_PORT || '22' }}
          key: ${{ secrets.WORKER_VM_SSH_KEY }}
          fingerprint: ${{ secrets.WORKER_VM_FINGERPRINT }}
          envs: IMAGE_TAG,DOMAIN
          script: |
            set -eu
            cd /etc/safegarden/compose
            umask 077
            printf 'DOMAIN=%s\nIMAGE_TAG=%s\n' "$DOMAIN" "$IMAGE_TAG" > .env
            docker compose pull
            docker compose up -d
            docker image prune -f
