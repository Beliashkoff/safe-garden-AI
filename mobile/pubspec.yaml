name: agronom_ai
description: "ИИ Агроном — диагностика растений с помощью AI"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.0
  dio: ^5.7.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_secure_storage: ^9.0.0
  # RU-провайдеры входа (406-ФЗ): VK ID — официальный SDK (confidential flow,
  # код выдаётся приложению, обмен — на бэке); Яндекс ID — authorization code
  # через системный браузер (ASWebAuthenticationSession / Custom Tabs).
  vkid_flutter_sdk: ^1.0.3
  flutter_web_auth_2: ^5.0.3
  crypto: ^3.0.0
  flutter_markdown_plus: ^1.0.7
  # Brand logo + in-UI vector icons rendered from bundled SVG (loft redesign).
  flutter_svg: ^2.0.10
  # drift codegen (drift_dev) shares source_gen with freezed; the project is on
  # freezed 2.5 (source_gen ^2), so drift is pinned to the last line that uses
  # source_gen ^2 (drift_dev >=2.28.2 moved to source_gen ^3). drift_flutter is
  # omitted on purpose — we open the database with NativeDatabase directly.
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  # Photo attachments (stage 3.3): pick from camera/gallery, compress, request
  # runtime permissions.
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  permission_handler: ^11.3.1
  record: ^6.2.1
  just_audio: ^0.10.5
  # Fertilizer card deeplink (stage 5.3): open the product page in the browser.
  url_launcher: ^6.3.0
  # Share an assistant answer via the native share sheet (loft redesign footer).
  # Pinned to 12.x: 13.x pulls win32 ^6, which conflicts with the win32 ^5 that
  # flutter_secure_storage 9.x requires (desktop-only transitive, but pub solves
  # globally). 12.x keeps the SharePlus.instance / ShareParams API.
  share_plus: ^12.0.2
  sentry_flutter: ^9.22.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  drift_dev: ^2.28.3
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/

  # Onest — the loft redesign typeface (variable font, weight axis 100–900).
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-VariableFont_wght.ttf

# Placeholder app icon (ROADMAP §6.4). Regenerate platform assets with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21

# Placeholder branded splash. Regenerate platform assets with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#EEECE4"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#EEECE4"
    image: assets/icon/splash_logo.png
