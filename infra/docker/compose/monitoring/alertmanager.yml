# Alertmanager routing (ARCH §9 / ROADMAP §6.6: test alert to email).
#
# Secrets are NOT stored here. The SMTP password is read from a file mounted at
# /etc/alertmanager/secrets (kept on the VM, outside git):
#   /etc/safegarden/monitoring/secrets/smtp_password
# Non-secret values (recipient, SMTP user) are set inline below. Alertmanager
# does NOT expand ${ENV} vars in this file, which is why the secret uses *_file.
# Email is the only channel; Telegram can be added later (telegram_configs +
# bot_token_file + chat_id) if desired.

route:
  receiver: team
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: team
      repeat_interval: 1h

receivers:
  - name: team
    email_configs:
      # Yandex 360 SMTP, STARTTLS на 587. Пароль приложения — из *_file.
      - to: noreply@agronomai.site
        from: noreply@agronomai.site
        smarthost: smtp.yandex.ru:587
        auth_username: noreply@agronomai.site
        auth_password_file: /etc/alertmanager/secrets/smtp_password
        require_tls: true
        send_resolved: true
