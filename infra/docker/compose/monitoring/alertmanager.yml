# Alertmanager routing (ARCH §9 / ROADMAP §6.6: test alert to email + Telegram).
#
# Secrets are NOT stored here. Telegram bot token and SMTP password are read from
# files mounted at /etc/alertmanager/secrets (kept on the VM, outside git):
#   /etc/safegarden/monitoring/secrets/telegram_bot_token
#   /etc/safegarden/monitoring/secrets/smtp_password
# Non-secret, deployment-specific values (chat id, recipient, SMTP user) are set
# inline below — adjust per environment. Alertmanager does NOT expand ${ENV}
# vars in this file, which is why secrets use the *_file form.

route:
  receiver: team
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: team
      repeat_interval: 1h

receivers:
  - name: team
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id: 100000000 # PLACEHOLDER — replace with the real chat id on deploy
        api_url: https://api.telegram.org
        send_resolved: true
    email_configs:
      # Yandex 360 SMTP. If your tenant only allows 465 (implicit SSL), prefer
      # Telegram as the primary channel — Alertmanager's email uses STARTTLS.
      - to: biogrowth.ru@gmail.com
        from: noreply@agronomai.site
        smarthost: smtp.yandex.ru:587
        auth_username: noreply@agronomai.site
        auth_password_file: /etc/alertmanager/secrets/smtp_password
        require_tls: true
        send_resolved: true
