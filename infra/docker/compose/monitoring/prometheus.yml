global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Backend API — the dedicated internal metrics listener (METRICS_PORT=9100),
  # reachable over the shared docker network. Not the public :8080.
  - job_name: api
    static_configs:
      - targets: ["api:9100"]

  # Host metrics (disk, CPU, memory) for node-level alerts.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # PostgreSQL metrics (connections, activity) for DB alerts. OPTIONAL — active
  # only with the monitoring "pg" profile (postgres-exporter). DB metrics are
  # otherwise available in Yandex native monitoring. Uncomment when running
  # `docker compose --profile pg up`.
  # - job_name: postgres
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # Prometheus self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
