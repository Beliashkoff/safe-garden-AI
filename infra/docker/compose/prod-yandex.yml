name: safegarden-api

services:
  api:
    image: ghcr.io/beliashkoff/safe-garden-ai/api:${IMAGE_TAG:-latest}
    env_file:
      - path: /etc/safegarden/.env
        required: false
    # JWT signing keys + mTLS cert chain, read-only. Container paths equal host
    # paths so the env vars in .env (JWT_KEYS_DIR, INTERNAL_MTLS_*_PATH,
    # LLM_WORKER_*_PATH) resolve identically inside and out.
    volumes:
      - /etc/safegarden/jwt-keys:/etc/safegarden/jwt-keys:ro
      - /etc/safegarden/certs:/etc/safegarden/certs:ro
    # Internal mTLS listener (:8090) для обратного вызова worker->backend
    # recommend_fertilizer (ARCH §11.3). Доступен только с IP worker-VM (Yandex SG
    # ingress 8090); аутентификация — клиентский серт. Публичный api — за Caddy.
    ports:
      - "8090:8090"
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN env required}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
