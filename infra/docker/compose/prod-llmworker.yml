name: safegarden-llmworker

services:
  llmworker:
    image: ghcr.io/beliashkoff/safe-garden-ai/llmworker:${IMAGE_TAG:-latest}
    env_file:
      # Секреты на LUKS-томе, смонтированном в /etc/llmworker (ARCH §8.6);
      # после ребута том переоткрывается вручную (setup-luks.sh open).
      - path: /etc/llmworker/.env
        required: false
    volumes:
      # Клиентский серт (worker-client) + CA для обратного вызова worker->backend
      # (ARCH §11.3); читаются при старте в buildCallbackMTLS. Тот же LUKS-том.
      - /etc/llmworker/certs:/etc/llmworker/certs:ro
    restart: unless-stopped
    networks:
      - internal
    # No Docker healthcheck: the runtime image is distroless (no wget/sh to exec
    # a probe). Caddy orders startup via depends_on: service_started; liveness is
    # covered by restart: unless-stopped. /healthz is still served for the mTLS
    # smoke test and external monitoring.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/llmworker/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN env required}
    depends_on:
      llmworker:
        condition: service_started
    networks:
      - internal

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
