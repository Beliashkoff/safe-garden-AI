name: safegarden-llmworker

services:
  llmworker:
    image: ghcr.io/beliashkoff/safe-garden-ai/llmworker:${IMAGE_TAG:-latest}
    env_file:
      - path: /etc/safegarden/.env
        required: false
    restart: unless-stopped
    networks:
      - internal
    # No Docker healthcheck: the runtime image is distroless (no wget/sh to exec
    # a probe). Caddy orders startup via depends_on: service_started; liveness is
    # covered by restart: unless-stopped. /healthz is still served for the mTLS
    # smoke test and external monitoring.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/safegarden/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN env required}
    depends_on:
      llmworker:
        condition: service_started
    networks:
      - internal

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
